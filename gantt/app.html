<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Agent Gantt</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--muted:#5b6475;--line:#d7dbe3;--accent:#a3385f;--head:#eef1f6;
 --warn:#fff3e0;--warns:#d08a2a;--rec:#e8f0fb;--recs:#3d6fb6;--ok:#e6f4ea;--oks:#4b9a5f;--ng:#fbe9e7;--ngs:#c0504d;
 --gantt-find:#ffd54a;color-scheme:light dark}
@media (prefers-color-scheme: dark){:root{--bg:#14171d;--card:#1c2028;--ink:#e6e9ef;--muted:#9aa3b4;--line:#323846;
 --accent:#e57fa4;--head:#232834;--warn:#3a2c15;--warns:#e0a84a;--rec:#18263a;--recs:#6e9fe0;--ok:#1b3324;--oks:#6cc086;
 --ng:#3a1f1d;--ngs:#e0807a;--gantt-find:#8a6a00}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.4 "Yu Gothic UI","Meiryo","Hiragino Sans",sans-serif;
 display:flex;flex-direction:column;overflow:hidden}
body.colresize,body.colresize *{cursor:ew-resize!important}
button,select,input{font:inherit;color:var(--ink)}
button{cursor:pointer}

/* toolbar: one row of fixed height; buttons of one size; nothing moves when a state changes */
#bar{flex:none;height:46px;display:flex;align-items:center;gap:5px;padding:0 10px;background:var(--card);
 border-bottom:1px solid var(--line);overflow:hidden}
#ttl{flex:0 1 200px;min-width:0;margin-right:2px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{flex:none;width:66px;height:28px;padding:0;font-size:12px;font-weight:400;background:var(--head);
 border:1px solid var(--line);border-radius:6px}
.tb:hover{border-color:var(--recs)}
.tb:active{font-weight:400;background:var(--line)}
.tb:disabled{opacity:.5;cursor:default}
.tb[aria-pressed="true"]{background:var(--rec);border-color:var(--recs)}
.tb.sq{width:24px;font-size:15px;line-height:1}
.stp,.who,.seg{flex:none;display:flex;align-items:center;gap:2px}
.who{gap:4px}
.seg{gap:0}
.seg .tb{width:62px;border-radius:0}
.seg .tb:first-child{border-radius:6px 0 0 6px}
.seg .tb:last-child{border-radius:0 6px 6px 0;margin-left:-1px}
.seg .tb[aria-pressed="true"]{background:var(--recs);border-color:var(--recs);color:var(--card)}
.cap{flex:none;padding:0 2px;color:var(--muted);font-size:12px}
.find{position:relative;flex:none;width:156px;height:28px}
#q{width:100%;height:28px;padding:0 50px 0 8px;font-size:12px;background:var(--card);border:1px solid var(--line);
 border-radius:6px}
#q:focus{outline:none;border-color:var(--recs)}
#qn{position:absolute;right:28px;top:0;line-height:28px;font-size:11px;color:var(--muted);pointer-events:none}
#qx{position:absolute;right:2px;top:2px;width:24px;height:24px;padding:0;font-size:14px;color:var(--muted);
 background:transparent;border:0;border-radius:4px}
#qx:hover{background:var(--head)}
#who{width:108px;height:28px;padding:0 4px;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:6px}
#legend{flex:1 1 0;min-width:0;max-height:40px;display:flex;flex-wrap:wrap;align-content:center;align-items:center;
 overflow:hidden;color:var(--muted);font-size:11.5px;line-height:1.3}
#lgList{display:flex;flex-wrap:wrap;gap:1px 12px;margin-left:4px}
#bLegend{display:none}
#legend.folded{flex:none;width:66px}
#legend.folded #bLegend{display:block}
#legend.folded #lgList{display:none;position:fixed;top:44px;z-index:8;flex-direction:column;flex-wrap:nowrap;gap:4px;
 margin:0;padding:8px 12px;white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:6px;
 box-shadow:0 6px 16px rgba(0,0,0,.18)}
#legend.folded.open #lgList{display:flex}
.lg{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.sw{display:inline-block;width:16px;height:10px;border:1px solid var(--line);border-radius:2px}
.sw.k-plan{background:var(--rec);border-color:var(--recs)}
.sw.k-tbd{background:repeating-linear-gradient(45deg,var(--rec) 0 3px,var(--card) 3px 6px);border:1px dashed var(--recs)}
.sw.k-due{background:var(--warn);border-color:var(--warns)}
.sw.k-ext{background:var(--ng);border-color:var(--ngs)}
.sw.k-wait{background:repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px 5px)}
.sw.k-off{background:var(--line)}
.sw.k-done{background:var(--ok);border-color:var(--oks)}
/* the status floats over the chart's lower right corner: the toolbar keeps its room for the buttons */
#status{position:fixed;right:22px;bottom:22px;z-index:6;max-width:46vw;padding:2px 9px;white-space:nowrap;overflow:hidden;
 text-overflow:ellipsis;color:var(--muted);font-size:12px;background:var(--card);border:1px solid var(--line);
 border-radius:4px;pointer-events:none}
#status:empty{display:none}
#status.err{color:var(--ngs);border-color:var(--ngs)}

/* file menu */
#menu{position:fixed;top:44px;z-index:8;min-width:300px;max-width:560px;max-height:70vh;overflow:auto;padding:4px 0;
 background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.mi{position:relative;display:block;width:100%;padding:5px 14px 5px 28px;text-align:left;background:transparent;border:0}
.mi:hover{background:var(--head)}
.mi b,.mi span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi span{color:var(--muted);font-size:11.5px}
.mi.cur::before{content:"✓";position:absolute;left:10px;top:5px;color:var(--accent)}
.mn{padding:6px 14px;color:var(--muted)}
#menu hr{margin:4px 0}

/* chart: four copies of one SVG in one grid cell; the date header, the title columns and their corner stay put */
#sc{flex:1;min-height:0;overflow:auto;background:var(--card)}
#chart{display:grid;width:max-content;user-select:none;-webkit-user-select:none}
.pn{grid-area:1/1;overflow:hidden;background:var(--card)}
.pn.left,.pn.head,.pn.corner{position:sticky;align-self:start;justify-self:start}
.pn.left{left:0;z-index:2;box-shadow:1px 0 0 var(--line)}
.pn.head{top:0;z-index:3;box-shadow:0 1px 0 var(--line)}
.pn.corner{top:0;left:0;z-index:4}
.pn svg{display:block;max-width:none}
.rz{position:absolute;top:0;right:0;width:7px;height:100%;z-index:1;cursor:ew-resize}
.rz:hover,body.colresize .rz{background:linear-gradient(to right,transparent 5px,var(--recs) 5px)}
.empty{padding:40px 24px;color:var(--muted);font-size:14px}
.gantt text{cursor:inherit}
.gantt .row.hv .hov{fill:var(--ink);fill-opacity:.05}
.gantt .row.cur .hov{fill:var(--accent);fill-opacity:.08}
.gantt g.row[data-p]{cursor:pointer}
.gantt g.row[data-p] text.g{fill:var(--recs)}
.gantt .it.sel .b,.gantt .it.sel .m{stroke:var(--accent);stroke-width:2}
.gantt .ttl,.gantt .ttl *,.gantt .go{cursor:pointer}
.gantt .rs text,.gantt .rs .qh{display:none}
#tip{position:fixed;z-index:9;pointer-events:none;padding:2px 7px;font-size:12px;white-space:nowrap;
 background:var(--ink);color:var(--card);border-radius:3px}
/* the details of a bar, a milestone, a row or a person: never in the way of the mouse */
#hover{position:fixed;z-index:10;pointer-events:none;max-width:360px;padding:6px 10px;font-size:12px;line-height:1.5;
 color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.18);
 overflow-wrap:anywhere}
#hover .ht{color:var(--muted)}
#hover .hk{color:var(--muted)}
#hover .hn{margin-top:4px;padding-top:4px;border-top:1px solid var(--line);white-space:pre-wrap}

/* drawer: overlay of a fixed width, the chart does not move */
#drawer{position:fixed;top:46px;right:0;bottom:0;width:340px;z-index:5;overflow:auto;background:var(--card);
 border-left:1px solid var(--line);box-shadow:-6px 0 16px rgba(0,0,0,.14)}
.dh{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;
 background:var(--head);border-bottom:1px solid var(--line)}
.x{width:28px;height:28px;padding:0;background:transparent;border:1px solid transparent;border-radius:6px}
.x:hover{border-color:var(--line)}
.dbody{padding:8px 12px 18px}
.dnote{margin:6px 0;color:var(--muted);font-size:12px}
.fl{display:flex;align-items:center;gap:8px;margin:6px 0}
.fl>span{flex:none;width:44px;color:var(--muted);font-size:12px}
.fl input,.fl select,.fl textarea{flex:1;min-width:0;padding:4px 6px;font:inherit;color:var(--ink);background:var(--card);
 border:1px solid var(--line);border-radius:4px}
.fl textarea{height:58px;resize:vertical}
.fl.top{align-items:flex-start}
.sm{flex:none;width:56px;height:26px;padding:0;font-size:12px;font-weight:400;background:var(--head);
 border:1px solid var(--line);border-radius:4px}
.sm:active,.btns button:active{font-weight:400}
.itm{margin:10px 0;padding:4px 8px 6px;border:1px solid var(--line);border-left:3px solid var(--line)}
.itm.hl{border-left-color:var(--accent)}
.ih{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.btns.one{grid-template-columns:1fr}
.btns button{height:28px;font-size:12px;font-weight:400;background:var(--head);border:1px solid var(--line);border-radius:6px}
.btns button:hover,.sm:hover{border-color:var(--recs)}
.pr{display:block;width:100%;margin:2px 0;padding:4px 6px;text-align:left;background:transparent;border:1px solid transparent;
 border-radius:4px}
.pr:hover{border-color:var(--line);background:var(--head)}
.pr span{display:block;color:var(--muted);font-size:11.5px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0 4px}
</style>
</head>
<body>
<div id="bar">
 <div id="ttl"></div>
 <button class="tb" id="bFile" aria-haspopup="menu" title="最近のファイル・ファイルの選択" hidden>ファイル</button>
 <button class="tb need" id="bAddRow">行の追加</button>
 <button class="tb need" id="bAddGroup">区切り追加</button>
 <button class="tb need" id="bUndo" title="元に戻す（Ctrl+Z）">取り消し</button>
 <span class="stp"><span class="cap">期間</span><button class="tb sq need" id="bOut" aria-label="期間の縮小"
  title="期間を縮める（1 日の幅を狭く。Ctrl+ホイール）">−</button><button class="tb sq need" id="bIn" aria-label="期間の拡大"
  title="期間を広げる（1 日の幅を広く。Ctrl+ホイール）">＋</button></span>
 <span class="stp"><span class="cap">行</span><button class="tb sq need" id="bRowsOut" aria-label="行の高さの縮小"
  title="行を低く（Alt+ホイール）">−</button><button class="tb sq need" id="bRowsIn" aria-label="行の高さの拡大"
  title="行を高く（Alt+ホイール）">＋</button></span>
 <span class="stp"><span class="cap">文字</span><button class="tb sq need" id="bTextOut" aria-label="文字の縮小"
  title="文字を小さく（項目と担当の列も。Ctrl+−）">−</button><button class="tb sq need" id="bTextIn" aria-label="文字の拡大"
  title="文字を大きく（項目と担当の列も。Ctrl+＋）">＋</button></span>
 <button class="tb need" id="bFit" aria-pressed="true" title="窓に合わせる（期間を窓の幅に、行を窓の高さに。文字の大きさはそのまま）">全体表示</button>
 <button class="tb need" id="bToday">今日</button>
 <span class="find"><input id="q" class="need" placeholder="検索" autocomplete="off" spellcheck="false"
  title="項目・担当・メモ・バーの名前で絞り込み（Ctrl+F、Esc で消去）"><span id="qn"></span><button id="qx" title="検索の消去（Esc）"
  hidden>×</button></span>
 <span class="who"><label class="cap" for="who"
  title="担当の欄の名前で分けます。括弧の中は数えません。「・」「、」で区切ると複数の人。同じ名前は同じ人。">担当</label><select
  id="who" class="need" title="この人の行だけ表示"><option value="">すべて</option></select></span>
 <span class="seg"><button class="tb need" id="bOrder" aria-pressed="true" title="データの順（区切りごと）に並べる">項目順</button><button
  class="tb need" id="bBy" aria-pressed="false" title="担当の人ごとに並べる（表示だけ。データの順は変えない）">担当ごと</button></span>
 <button class="tb" id="bShare" title="共有用に書き出し（データの share）" hidden>書き出し</button>
 <div id="legend"><button class="tb" id="bLegend">凡例</button><div id="lgList"></div></div>
</div>
<div id="menu" role="menu" hidden></div>
<div id="sc"><div id="chart"></div></div>
<aside id="drawer" hidden></aside>
<div id="status"></div>
<div id="tip" hidden></div>
<div id="hover" hidden></div>
<datalist id="people"></datalist>
<script>
'use strict';
window.__errors = [];
const $ = id => document.getElementById(id);
let statusTimer = null;
function setStatus(text, err) {
  const s = $('status');
  s.textContent = text; s.title = text; s.classList.toggle('err', !!err);
  clearTimeout(statusTimer);
  if (!err) statusTimer = setTimeout(() => { if (s.textContent === text) s.textContent = ''; }, 6000);
}
function fail(m) { window.__errors.push(String(m)); setStatus('エラー: ' + m, true); }
window.addEventListener('error', e => fail(e.message || e.error));
window.addEventListener('unhandledrejection', e => fail((e.reason && e.reason.message) || e.reason));

const ZOOMS = [6, 8, 10, 14, 18, 24, 32, 40];                       // day widths of 期間 − / ＋
const ROWS = [0.7, 0.8, 0.9, 1, 1.15, 1.3, 1.5, 1.75, 2, 2.4, 3];   // row scales of 行 − / ＋
const TEXTS = [0.8, 0.9, 1, 1.1, 1.2, 1.3, 1.45, 1.6, 1.8, 2];      // text scales of 文字 − / ＋ (about 10 % a step)
const HELP = ['担当の欄の名前で分けます。括弧の中は数えません。', '「・」「、」で区切ると複数の人。同じ名前は同じ人。'];
const S = {day: 14, text: 1.3, rows: 1, labelW: null, fit: true, byOwner: false, query: '', owner: '',
           manual: {day: 14, rows: 1}, data: null, svg: '', mtime: '', file: '', path: '', nofile: false, share: false,
           unset: '未定', members: {}, legend: {}, kinds: [], sel: null, drawer: null, person: null, busy: false,
           inflight: false, again: false, loop: null, gen: 0, sig: '', reveal: false, fitAt: null, refits: 0, ownSig: '',
           lgSig: '', size: '', hoverY: null, tip: null, tipKey: '', tipTimer: null, mx: 0, my: 0};
let drag = null, colDrag = null;

// ---- API: pywebview (desktop window) or POST /api/<name> (browser)
const HTTP = location.protocol === 'http:' || location.protocol === 'https:';
const apiReady = HTTP ? Promise.resolve() : new Promise(res => {
  const ok = () => window.pywebview && window.pywebview.api && typeof window.pywebview.api.get === 'function';
  if (ok()) res(); else window.addEventListener('pywebviewready', () => res(), {once: true});
});
async function api(name, ...args) {
  await apiReady;
  if (!HTTP) return await window.pywebview.api[name](...args);
  const r = await fetch('/api/' + name, {method: 'POST', headers: {'Content-Type': 'application/json'},
                                          body: JSON.stringify(args)});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

// ---- dates (days since 1970-01-01, UTC)
const DAY = 86400000;
const pd = s => { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(s || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) / DAY : null; };
const fd = n => new Date(n * DAY).toISOString().slice(0, 10);
const md = n => { const d = new Date(n * DAY); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate(); };
const dl = n => md(n) + '（' + '日月火水木金土'[new Date(n * DAY).getUTCDay()] + '）';
const todayN = () => { const d = new Date(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY; };
const hm = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const clamp = (v, a, b, q) => Math.round(Math.max(a, Math.min(b, v)) * q) / q;
const clampDay = v => clamp(v, 6, 40, 100), clampRows = v => clamp(v, 0.7, 3, 100), clampLabel = v => clamp(v, 120, 1200, 1);

// ---- state
const rowOf = id => S.data && S.data.rows.find(r => r.id === id);
const isGroup = r => 'group' in r;
const isMs = it => it.on != null;
const snap = it => { const o = {}; for (const k of ['from', 'to', 'on', 'label', 'kind']) if (it[k] != null) o[k] = it[k]; return o; };
const itemName = it => it.label || '無題';

// what the chart shows besides the data: sent with every call; with fit, Python picks the day width and the row scale
function view() {
  const sc = $('sc'), v = {text: S.text, rows: S.rows, label_width: S.labelW, query: S.query, owner: S.owner, by_owner: S.byOwner};
  if (S.fit && sc.clientWidth > 200 && sc.clientHeight > 80) { v.fit = true; v.w = sc.clientWidth; v.h = sc.clientHeight; }
  return v;
}
function take(res) {
  if (!res) return;
  S.gen++;
  if (res.nofile) { S.nofile = true; S.data = null; S.svg = ''; S.mtime = ''; empty(); return; }
  S.nofile = false;
  S.data = res.data; S.svg = res.svg; S.mtime = res.mtime;
  S.day = res.day; S.text = res.text; S.rows = res.rows; S.labelW = res.label_width; S.fitAt = res.fitted || null;
  S.file = res.file; S.path = res.path; S.share = !!res.share; S.members = res.members || {};
  if (res.unset) S.unset = res.unset;
  if (res.kinds) S.kinds = res.kinds;
  if (res.legend) setLegend(res.legend);
  $('bShare').hidden = !(HTTP && res.share);                   // in the window it is in the file menu
  $('ttl').textContent = res.data.title || S.file;
  $('ttl').title = (res.data.title || S.file) + '\n' + S.path;
  document.title = res.title || 'Agent Gantt';
  $('qn').textContent = S.query ? res.shown + ' 行' : '';
  setOwners(res.owners || []);
  need(true);
  paint();
  checkFit();
}
function paint() {                       // the body, then the frozen title columns, date header and their corner on top
  const sc = $('sc'), l = sc.scrollLeft, t = sc.scrollTop, svg = S.svg, root = svg.slice(0, svg.indexOf('>'));
  const at = k => +((new RegExp(' ' + k + '="([^"]*)"').exec(root) || [0, 0])[1]);
  const W = at('width'), H = at('height'), x0 = at('data-x0'), hh = at('data-hh');
  const copy = n => svg.replace(/(id="|url\(#)gt-([hw])(?=[")])/g, '$1gt-$2' + n);      // ids stay unique in the page
  const pane = (cls, w, h, n, extra) => '<div class="pn ' + cls + '" style="width:' + w + 'px;height:' + h + 'px">' + copy(n) + extra + '</div>';
  const rz = '<div class="rz" title="ドラッグで項目の列の幅を変更（ダブルクリックで元の幅）"></div>';
  $('chart').innerHTML = '<div class="pn body">' + svg + '</div>' + pane('left', x0, H, 1, rz) + pane('head', W, hh, 2, '')
                       + pane('corner', x0, hh, 3, rz);
  sc.scrollLeft = l; sc.scrollTop = t;
  S.hoverY = null;
  mark();
  syncDrawer();
}
function empty() {
  $('chart').innerHTML = '<div class="empty">ファイルが開かれていません。「ファイル」から選んでください。</div>';
  $('ttl').textContent = '';
  document.title = 'Agent Gantt';
  need(false);
  closeDrawer();
}
function need(on) { for (const el of document.querySelectorAll('.need')) el.disabled = !on; }
function mark() {
  for (const g of document.querySelectorAll('#chart g.it'))
    g.classList.toggle('sel', !!S.sel && g.dataset.r === S.sel.r && +g.dataset.i === S.sel.i);
  for (const g of document.querySelectorAll('#chart g.row'))
    g.classList.toggle('cur', g.dataset.r === S.drawer || (S.person != null && g.dataset.p === S.person));
}
function geom() {                          // the body copy: its box is the whole chart's
  const svg = document.querySelector('#chart .pn.body svg');
  if (!svg) return null;
  const r = svg.getBoundingClientRect();
  return {left: r.left, top: r.top, k: r.width / svg.viewBox.baseVal.width, x0: +svg.dataset.x0, dw: +svg.dataset.dw,
          d0: pd(svg.dataset.d0), d1: pd(svg.dataset.d1), h: +svg.getAttribute('height'), hh: +svg.dataset.hh,
          tc: +svg.dataset.tc};
}
function again() { if (S.inflight) S.again = true; else refresh(); }
function refresh() {                       // render again with the current view; calls while one runs are folded into it
  if (S.nofile) return Promise.resolve();
  if (S.inflight) { S.again = true; return S.loop; }
  S.inflight = true;
  S.loop = (async () => {
    try { do { S.again = false; take(await api('get', S.day, view())); } while (S.again); }
    catch (e) { fail(e.message || e); }
    finally { S.inflight = false; }
  })();
  return S.loop;
}
function checkFit() {                      // a scrollbar came or went: fit the new visible size (twice at most)
  if (!S.fit || !S.fitAt) { S.refits = 0; return; }
  const sc = $('sc');
  if (sc.clientWidth === S.fitAt[0] && sc.clientHeight === S.fitAt[1]) { S.refits = 0; return; }
  if (++S.refits <= 2) again();
}
async function commit(ops) {
  S.busy = true;
  try {
    const res = await api('apply', ops, S.day, view());
    if (res.ok) { take(res); setStatus('保存 ' + hm()); return res; }
    if (res.conflict) { await refresh(); setStatus('ほかで変わったので読み直し', true); }
    else { setStatus(res.error || 'エラー', true); syncDrawer(); }
  } catch (e) { fail(e.message || e); }
  finally { S.busy = false; }
  return null;
}
async function poll() {
  if (drag || colDrag || S.busy || S.inflight || !S.mtime || S.nofile) return;
  const gen = S.gen;
  try {
    const res = await api('poll', S.mtime, S.day, view());
    if (!res || gen !== S.gen || drag || colDrag || S.busy || S.inflight) return;
    if (res.error) { setStatus('読めません: ' + res.error, true); return; }
    take(res);
    setStatus('外で更新 ' + hm());
  } catch (e) { setStatus('接続できません', true); }
}

function savePrefs(p) {

// ---- zoom: 期間 (day width, Ctrl+wheel), 行 (row scale, Alt+wheel), 文字 (text scale, Ctrl + / −)
function anchorX(at) {                     // the date under the mouse (else the middle of the timeline) and where it is
  const sc = $('sc'), G = geom();
  if (!G) return null;
  let ax = at ? at.clientX - sc.getBoundingClientRect().left : -1;
  if (ax < G.x0 || ax > sc.clientWidth) ax = (G.x0 + sc.clientWidth) / 2;
  return {ax: ax, date: (sc.scrollLeft + ax - G.x0) / G.dw};
}
function keepX(a) { const sc = $('sc'), G = geom(); if (a && G) sc.scrollLeft = Math.max(0, G.x0 + a.date * G.dw - a.ax); }
function anchorY(at) {                     // the place in the rows under the mouse (else the middle) and where it is
  const sc = $('sc'), G = geom();
  if (!G) return null;
  let ay = at ? at.clientY - sc.getBoundingClientRect().top : -1;
  if (ay < G.hh || ay > sc.clientHeight) ay = (G.hh + sc.clientHeight) / 2;
  return {ay: ay, f: (sc.scrollTop + ay - G.hh) / Math.max(1, G.h - 1 - G.hh)};
}
function keepY(a) { const sc = $('sc'), G = geom(); if (a && G) sc.scrollTop = Math.max(0, G.hh + a.f * (G.h - 1 - G.hh) - a.ay); }
const step = (list, cur, dir) => dir > 0 ? list.find(z => z > cur + 0.001) : [...list].reverse().find(z => z < cur - 0.001);
async function zoomDay(nd, at) {
  if (S.nofile || !nd) return;
  const a = anchorX(at);
  S.day = clampDay(nd);
  manual();
  await refresh();
  keepX(a);
}
async function zoomRows(nr, at) {          // rows never get lower than the text: from the height they have now
  if (S.nofile || !nr) return;
  if (nr < S.text - 0.001 && S.rows <= S.text + 0.001) { setStatus('行は文字より低くできません（文字 − で小さく）'); return; }
  const a = anchorY(at);
  S.rows = clampRows(Math.max(nr, S.text));
  manual();
  await refresh();
  keepY(a);
}
async function zoomText(dir) {             // the fit stays: it sets the day width and the rows around the text
  if (S.nofile) return;
  const nt = step(TEXTS, S.text, dir);
  if (!nt) return;
  const a = anchorX(null), b = anchorY(null);
  S.text = nt;
  savePrefs({text: nt});
  await refresh();
  keepX(a); keepY(b);
}
const rowsNow = () => Math.max(S.rows, S.text);
function scrollToday(quiet) {
  const G = geom(), t = todayN(), sc = $('sc');
  if (!G) return;
  if (t < G.d0 || t > G.d1) { if (!quiet) setStatus('今日は範囲の外'); return; }
  sc.scrollLeft = Math.max(0, G.x0 + (t - G.d0) * G.dw + G.dw / 2 - (G.x0 + sc.clientWidth) / 2);
}

// ---- toolbar
async function addRow(after, row) {
  const before = new Set(S.data.rows.map(r => r.id));

  const nr = res && S.data.rows.find(r => !before.has(r.id));

  const g = document.querySelector('#chart .pn.body g.row[data-r="' + CSS.escape(nr.id) + '"]'), sc = $('sc'), G = geom();
  if (g && G && (+g.dataset.y < sc.scrollTop + G.hh || +g.dataset.y > sc.scrollTop + sc.clientHeight - 60))
    sc.scrollTop = Math.max(0, +g.dataset.y - G.hh - 40);
}

function setVal(inp, v) {

}

    const sig = 'p|' + S.person + '|' + S.members[S.person].map(id => { const r = rowOf(id); return id + '=' + (r && r.title) + '/' + (r && r.owner); }).join('|');

  if (sig !== S.sig) { S.sig = sig; el.innerHTML = drawerHTML(r); }          // structure changed: rebuild, else patch values

async function applyField(t) {

  if (t.dataset.f) {
    const f = t.dataset.f, v = t.value.trim();
    await commit([{op: 'row', row: r.id, set: {[f]: f === 'group' ? v : (v || null)}}]);
  } else if (t.dataset.k) {
    const i = +t.closest('.itm').dataset.i, it = r.items[i], k = t.dataset.k;
    let v = t.value;
    if (t.type === 'date') {
      const n = pd(v);
      if (n === null || n < pd('1990-01-01') || n > pd('2100-12-31')) { syncDrawer(); return; }   // a year still being typed
    } else v = v.trim() || null;
    await commit([{op: 'item', row: r.id, i: i, expect: snap(it), set: {[k]: v}}]);
  }

async function renamePerson() {            // one apply: one 取り消し undoes every row
  const p = S.person, inp = $('drawer').querySelector('[data-pn]'), to = inp ? inp.value.trim() : '';
  if (p == null || !to || to === p) return;
  if (S.owner === p) S.owner = to;

  if (!res) return;

const timers = new Map();          // a date field fires `change` for every valid value while typing: apply once it settles
function later(t) { clearTimeout(timers.get(t)); timers.set(t, setTimeout(() => { timers.delete(t); applyField(t); }, 600)); }
function flush(t) { if (timers.has(t)) { clearTimeout(timers.get(t)); timers.delete(t); applyField(t); } }
async function delItem(r, i) {

  if (!it || !confirm('「' + itemName(it) + '」を削除しますか?')) return;

async function addItem(r, ms) {
  const G = geom(), items = r.items || [];
  const ends = items.map(it => pd(isMs(it) ? it.on : it.to)).filter(n => n !== null);
  let start = ends.length ? Math.max(...ends) + 1 : null;
  if (G && (start === null || start > G.d1)) start = G.d0 + (7 - (G.d0 + 3) % 7) % 7;     // first Monday shown
  if (start === null) start = todayN();
  const item = ms ? {on: fd(start), label: '新しい期日', kind: 'due'}
                  : {from: fd(start), to: fd(start + 6), label: '新しい作業', kind: 'plan'};
  const res = await commit([{op: 'add_item', row: r.id, item: item}]);
  if (res) openDrawer(r.id, rowOf(r.id).items.length - 1, true);
}
async function act(b) {

  const r = rowOf(S.drawer);
  if (!r) return;
  if (a === 'openlink') {
    const g = [...document.querySelectorAll('#chart g.ttl')].find(x => x.dataset.r === r.id), go = g && g.querySelector('.go');
    if (!go) return setStatus('リンクなし');

  }
  if (a === 'delitem') return delItem(r, +b.closest('.itm').dataset.i);
  if (a === 'addbar') return addItem(r, false);
  if (a === 'addms') return addItem(r, true);
  if (a === 'up' || a === 'down') return commit([{op: 'move_row', row: r.id, dir: a === 'up' ? -1 : 1}]);
  if (a === 'addrow') return addRow(r.id, {title: '新しい行'});

    if (!confirm('行「' + (r.title || r.group || r.id) + '」を削除しますか?')) return;

  }
}
$('drawer').addEventListener('change', e => { if (e.target.type === 'date') later(e.target); else applyField(e.target); });

// ---- hover details: a bar or milestone, a row title, a person header (after 150 ms; never under the pointer)
function whenText(it) {
  if (isMs(it)) { const a = pd(it.on); return a === null ? String(it.on) : dl(a); }
  const a = pd(it.from), b = pd(it.to);
  if (a === null || b === null) return (it.from || '') + '〜' + (it.to || '');
  let w = 0;
  for (let d = a; d <= b; d++) { const k = new Date(d * DAY).getUTCDay(); if (k > 0 && k < 6) w++; }
  return dl(a) + '〜' + dl(b) + '・' + (b - a + 1) + ' 日（平日 ' + w + ' 日）';
}
function tipHTML(t) {
  const kv = (k, v) => '<span class="hk">' + k + '</span> ' + esc(v);
  if (t.p != null) return '<b>' + esc(t.p) + '</b>（' + (S.members[t.p] || []).length + ' 件）<div class="hk">クリックで名前の変更</div>';
  const r = rowOf(t.r);
  if (!r) return '';
  if (t.i == null) {
    let h = '<b>' + esc(r.title || r.group || r.id) + '</b>';
    if (r.owner) h += '<div>' + kv('担当', r.owner) + '</div>';
    if (t.href || r.link) h += '<div>' + kv('リンク', t.href || r.link) + '</div>';
    return h + (r.note ? '<div class="hn">' + esc(r.note) + '</div>' : '');
  }
  const it = (r.items || [])[t.i];
  if (!it) return '';
  const kind = S.kinds.includes(it.kind) ? it.kind : 'plan';
  return '<div class="ht">' + esc(r.title || r.id) + '</div><b>' + esc(itemName(it)) + '</b><div>' + esc(whenText(it)) + '</div>'
       + '<div>' + kv('種類', S.legend[kind] || kind) + (r.owner ? '　' + kv('担当', r.owner) : '') + '</div>'
       + (it.note ? '<div class="hn">' + esc(it.note) + '</div>' : '');
}
function placeTip() {
  const el = $('hover'), w = el.offsetWidth, h = el.offsetHeight;
  let x = S.mx + 14, y = S.my + 18;
  if (x + w > innerWidth - 8) x = Math.max(8, S.mx - w - 12);        // flip at the right and bottom edges
  if (y + h > innerHeight - 8) y = Math.max(8, S.my - h - 12);
  el.style.left = x + 'px'; el.style.top = y + 'px';
}
function hideTip() { clearTimeout(S.tipTimer); S.tipKey = ''; S.tip = null; $('hover').hidden = true; }
function showTip() {
  const html = S.tip ? tipHTML(S.tip) : '';
  if (!html || drag || colDrag) return;
  $('hover').innerHTML = html;
  $('hover').hidden = false;
  placeTip();
}

// ---- chart: drag, click, double-click, hover, the column handle (data-r / data-i are the data's own in every view)
const chart = $('chart');
function modeAt(g, clientX) {                       // within 5 px of a bar's end: resize (bars of 14 px or more)
  const b = g.querySelector('rect.b');
  if (!b) return 'move';
  const r = b.getBoundingClientRect();
  if (r.width >= 14) { if (clientX - r.left <= 5) return 'l'; if (r.right - clientX <= 5) return 'r'; }
  return 'move';
}
chart.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  hideTip();
  if (e.target.closest('.rz')) {
    e.preventDefault();
    const G = geom();
    if (G) { colDrag = {x: e.clientX, tc: G.tc, text: S.text}; document.body.classList.add('colresize'); }
    return;
  }
  const g = e.target.closest('g.it');
  if (!g) return;
  const r = rowOf(g.dataset.r), it = r && r.items[+g.dataset.i];
  if (!it) return;
  e.preventDefault();
  drag = {g: g, rid: r.id, i: +g.dataset.i, it: it, mode: isMs(it) ? 'move' : modeAt(g, e.clientX), x: e.clientX, dd: 0, geo: geom()};
  S.sel = {r: r.id, i: drag.i};
  mark();
  chart.style.cursor = drag.mode === 'move' ? 'move' : 'ew-resize';
});
function span(d, dd) {
  const mo = isMs(d.it), a = pd(mo ? d.it.on : d.it.from), b = mo ? a : pd(d.it.to);
  return d.mode === 'move' ? [a + dd, b + dd] : d.mode === 'l' ? [a + dd, b] : [a, b + dd];
}
function preview() {
  const G = drag.geo, [a, b] = span(drag, drag.dd), g = drag.g;
  if (drag.mode === 'move') g.setAttribute('transform', 'translate(' + drag.dd * G.dw + ' 0)');
  else {
    const rect = g.querySelector('rect.b'), s = Math.max(a, G.d0), e = Math.min(b, G.d1);
    rect.setAttribute('x', G.x0 + (s - G.d0) * G.dw);
    rect.setAttribute('width', (e - s + 1) * G.dw);
    g.classList.add('rs');
  }
  $('tip').textContent = isMs(drag.it) ? md(a) : md(a) + '〜' + md(b) + '（' + (b - a + 1) + '日）';
}
window.addEventListener('mousemove', e => {
  if (colDrag) {                                    // the title column follows the mouse
    const w = clampLabel((colDrag.tc + e.clientX - colDrag.x) / colDrag.text);
    if (w !== S.labelW) { S.labelW = w; again(); }
    return;
  }
  if (!drag) {
    const g = e.target.closest && e.target.closest('#chart g.it');
    chart.style.cursor = g ? (modeAt(g, e.clientX) === 'move' ? 'move' : 'ew-resize') : '';
    return;
  }
  const G = drag.geo, mo = isMs(drag.it), a = pd(mo ? drag.it.on : drag.it.from), b = mo ? a : pd(drag.it.to);
  let lo, hi, dd = Math.round((e.clientX - drag.x) / (G.dw * G.k));
  if (drag.mode === 'move') { lo = Math.min(0, G.d0 - a); hi = Math.max(0, G.d1 - b); }   // stay inside the range shown
  else if (drag.mode === 'l') { lo = Math.min(0, G.d0 - a); hi = b - a; }
  else { lo = a - b; hi = Math.max(0, G.d1 - b); }
  dd = Math.max(lo, Math.min(hi, dd));
  const tip = $('tip');
  tip.style.left = (e.clientX + 14) + 'px';
  tip.style.top = (e.clientY + 18) + 'px';
  if (dd !== drag.dd || tip.hidden) { drag.dd = dd; preview(); tip.hidden = false; }
});
function endDrag() { $('tip').hidden = true; chart.style.cursor = ''; drag = null; }
window.addEventListener('mouseup', async () => {
  if (colDrag) {
    colDrag = null;
    document.body.classList.remove('colresize');
    savePrefs({label_width: S.labelW});
    return;
  }
  if (!drag) return;
  const d = drag;
  endDrag();
  if (d.dd === 0) { paint(); openDrawer(d.rid, d.i); return; }      // no day moved: a click
  const it = d.it, set = {}, sh = (s, n) => fd(pd(s) + n);
  if (isMs(it)) set.on = sh(it.on, d.dd);
  else { if (d.mode !== 'r') set.from = sh(it.from, d.dd); if (d.mode !== 'l') set.to = sh(it.to, d.dd); }
  if (!await commit([{op: 'item', row: d.rid, i: d.i, expect: snap(it), set: set}])) paint();
});
chart.addEventListener('mousemove', e => {
  S.mx = e.clientX; S.my = e.clientY;
  if (drag || colDrag) return;
  const it = e.target.closest('g.it'), tl = !it && e.target.closest('g.ttl'), ph = !it && !tl && e.target.closest('g.row[data-p]');
  const go = tl && tl.querySelector('.go');
  const t = it ? {r: it.dataset.r, i: +it.dataset.i} : tl ? {r: tl.dataset.r, href: go ? go.dataset.href : ''} : ph ? {p: ph.dataset.p} : null;
  const key = t ? JSON.stringify(t) : '';
  if (key !== S.tipKey) {
    hideTip();
    S.tipKey = key; S.tip = t;
    if (t) S.tipTimer = setTimeout(showTip, 150);
  } else if (!$('hover').hidden) placeTip();
});
chart.addEventListener('mouseleave', () => { hideTip(); setHover(null); });
$('sc').addEventListener('scroll', hideTip, {passive: true});
function setHover(y) {                              // the row under the mouse, lit in every copy
  if (y === S.hoverY) return;
  S.hoverY = y;
  for (const g of document.querySelectorAll('#chart g.row.hv')) g.classList.remove('hv');
  if (y != null) for (const g of document.querySelectorAll('#chart g.row[data-y="' + y + '"]')) g.classList.add('hv');
}
chart.addEventListener('mouseover', e => { const g = e.target.closest && e.target.closest('g.row'); setHover(g ? g.dataset.y : null); });
chart.addEventListener('click', e => {
  const go = e.target.closest('.go');
  if (go) { api('open_link', go.dataset.href).catch(err => fail(err.message || err)); return; }
  const t = e.target.closest('g.ttl');
  if (t) { openDrawer(t.dataset.r, null); return; }
  const ph = e.target.closest('g.row[data-p]');
  if (ph) { openPerson(ph.dataset.p); return; }
  if (e.target.closest('rect.hit')) { S.sel = null; mark(); }
});
chart.addEventListener('dblclick', async e => {
  if (e.target.closest('.rz')) {                    // the title column back to the data's width
    S.labelW = null; savePrefs({label_width: null}); refresh(); return;
  }
  const h = e.target.closest('rect.hit');
  if (!h) return;
  const rid = h.closest('g.row').dataset.r, G = geom();
  const n = G.d0 + Math.floor(((e.clientX - G.left) / G.k - G.x0) / G.dw);
  const res = await commit([{op: 'add_item', row: rid, item: {from: fd(n), to: fd(n + 6), label: '新しい作業', kind: 'plan'}}]);
  if (res) openDrawer(rid, rowOf(rid).items.length - 1, true);
});

// ---- keys, wheel
window.addEventListener('keydown', e => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  const inField = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  const mod = (e.ctrlKey || e.metaKey) && !e.altKey;
  if (mod && (e.key === '+' || e.key === '=' || e.key === ';' || e.code === 'NumpadAdd')) { e.preventDefault(); zoomText(1); return; }
  if (mod && (e.key === '-' || e.key === '_' || e.code === 'NumpadSubtract')) { e.preventDefault(); zoomText(-1); return; }
  if (mod && !e.shiftKey && e.key.toLowerCase() === 'f') { e.preventDefault(); $('q').focus(); $('q').select(); return; }
  if (e.key === 'Escape') {
    hideTip();
    if (!$('menu').hidden) $('menu').hidden = true;
    else if (drag) { endDrag(); paint(); } else closeDrawer();
    return;
  }
  if (mod && !e.shiftKey && e.key.toLowerCase() === 'z' && !inField) { e.preventDefault(); doUndo(); return; }
  if (e.key === 'Delete' && !inField && S.sel && !drag) { e.preventDefault(); delItem(rowOf(S.sel.r), S.sel.i); }
});
window.addEventListener('wheel', e => {             // Ctrl: the day width at the mouse's date; Alt: the rows at its row
  const ctrl = e.ctrlKey || e.metaKey;
  if (!ctrl && !e.altKey) return;
  e.preventDefault();                               // no page zoom
  hideTip();
  const raw = e.deltaY || e.deltaX, d = e.deltaMode === 1 ? raw * 33 : e.deltaMode === 2 ? raw * 400 : raw;
  if (!d || S.nofile) return;
  const k = Math.max(0.7, Math.min(1.45, Math.exp(-d * 0.0015)));
  if (ctrl) zoomDay(S.day * k, e); else zoomRows(rowsNow() * k, e);
}, {passive: false});
let resizeTimer = null;
function resized() {                                // the window changed size (not a scrollbar: those are checkFit's)
  S.size = innerWidth + 'x' + innerHeight;
  layoutBar();
  S.refits = 0;
  if (S.fit) refresh();
}
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resized, 150); });
function tick() {                                   // every second: a resize the event missed (a hidden window), the file
  if (S.size && S.size !== innerWidth + 'x' + innerHeight && !drag && !colDrag) resized();
  poll();
}

// ---- start
(async function () {
  try {
    const p = await api('prefs', HTTP ? local() : null);
    S.day = p.day; S.text = p.text; S.rows = p.rows; S.labelW = p.label_width == null ? null : p.label_width;
    S.manual = {day: p.day, rows: p.rows};
    setFit(p.fit !== false);
    setView(p.by_owner === true);
    $('bFile').hidden = HTTP;                       // a browser has no file dialog: serve shows its one file
    await refresh();
    if (S.nofile) { if (!HTTP) switchTo('pick'); }
    else scrollToday(true);
  } catch (e) { fail(e.message || e); }
  S.size = innerWidth + 'x' + innerHeight;
  layoutBar();
  setInterval(tick, 1000);
})();
</script>
</body>
