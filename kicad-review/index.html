<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基板 レビュー</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟩</text></svg>">
<style>
:root {
  --bg: #f4f4f2; --panel: #ffffff; --line: #d8d8d4; --text: #222; --muted: #6b6b66; --sel: #ff00aa; --link: #2b6fd6;
  --sev-必須: #d33a2c; --sev-推奨: #e07800; --sev-任意: #2b6fd6; --sev-情報: #8a8a85;
  --st-open: #e0b400; --st-work: #ff8c00; --st-ask: #e01ee0; --st-done: #1a9a36; --st-keep: #7a7f85;
  --listw: 400px; --deth: 50%;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.45 system-ui, "Segoe UI", "Yu Gothic UI", sans-serif; color: var(--text); background: var(--bg);
  display: grid; grid-template-rows: auto 1fr; grid-template-columns: var(--listw) 6px 1fr; overflow: hidden; }
header { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; padding: 5px 8px; background: var(--panel);
  border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
header .name { font-weight: 700; max-width: 22em; overflow: hidden; text-overflow: ellipsis; }
header .file { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
#bstat { width: 7.5em; color: var(--muted); }
#pageNew { background: var(--sev-推奨); border-color: var(--sev-推奨); color: #fff; font-weight: 700; }
#pageNew.off { visibility: hidden; }   /* keeps its place so the header does not shift */
#bstat.err { color: var(--sev-必須); font-weight: 600; cursor: help; }
button { font: inherit; padding: 3px 9px; border: 1px solid var(--line); background: #fafaf8; border-radius: 4px; cursor: pointer; white-space: nowrap; }
button:hover { background: #eeeeea; }
button.on { background: #222; color: #fff; border-color: #222; }
.notice { position: fixed; z-index: 50; background: #222; color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 4px;
  pointer-events: none; white-space: nowrap; transition: opacity .3s; }

/* left column: list, splitter, detail */
aside { grid-column: 1; display: flex; flex-direction: column; background: var(--panel); min-width: 0; min-height: 0; }
#split { grid-column: 2; cursor: col-resize; background: var(--line); }
#split:hover, #split.drag, #hsplit:hover, #hsplit.drag { background: #a8a8a2; }
.list-h { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); color: var(--muted); }
#progress { width: 16em; font-weight: 600; color: var(--text); white-space: nowrap; }
.list-h .grow { flex: 1; }
#showDone, #showUnread { width: 7.5em; font-size: 12px; padding: 2px 4px; }
#list { flex: 1 1 0; overflow: auto; min-height: 60px; }
#hsplit { flex: 0 0 6px; cursor: row-resize; background: var(--line); }
#detail { flex: 0 0 var(--deth); display: flex; flex-direction: column; overflow: hidden; background: #fbfbf9; min-height: 0; }
#detBody { flex: 1 1 auto; overflow: auto; padding: 8px 10px; min-height: 0; }
.sev-h { position: sticky; top: 0; z-index: 1; background: #ecece8; padding: 4px 10px; font-weight: 700;
  border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
.sev-h small { font-weight: 400; color: var(--muted); }
.item { position: relative; display: grid; grid-template-columns: 1.4em auto 1fr; gap: 0 6px; align-items: baseline;
  padding: 5px 10px 5px 6px; border-bottom: 1px solid #eee; cursor: pointer; border-left: 4px solid transparent; }
.item:hover { background: #f6f6f2; }
.item.sel { background: #fff0fa; border-left-color: var(--sel); }
.item .st { font-weight: 700; text-align: center; }
.item .id { font-weight: 700; font-family: ui-monospace, Consolas, monospace; }
.item .chips { display: inline-flex; gap: 3px; margin-right: 4px; }
.item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 3.2em; }
.item.done .t, .item.done .id { opacity: .5; }
.item.fixed { background: #edf9f0; }
.item.fixed .t { text-decoration: line-through; text-decoration-color: var(--st-done); }
#progress .fixed { color: var(--st-done); font-weight: 400; }
.item .new { position: absolute; right: 8px; top: 6px; background: var(--link); color: #fff; font-size: 11px; border-radius: 8px; padding: 0 6px; }
.item .new.wait { background: #fff; color: var(--link); border: 1px solid var(--link); line-height: 14px; }
.chip { display: inline-block; font-size: 11px; line-height: 16px; padding: 0 5px; border-radius: 3px; color: #fff; font-weight: 600; vertical-align: 1px; }
.chip.owner { background: #fff; color: #444; border: 1px solid #bbb; font-weight: 400; line-height: 14px; }
.s-未確認 { color: var(--st-open); } .s-自分で修正, .s-修正を依頼 { color: var(--st-work); }
.s-質問 { color: var(--st-ask); } .s-修正済み { color: var(--st-done); } .s-このまま { color: var(--st-keep); }
.badge { display: inline-block; padding: 0 8px; border-radius: 9px; color: #fff; font-weight: 700; background: var(--st-open); }
.badge.s-修正済み { background: var(--st-done); color: #fff; } .badge.s-このまま { background: var(--st-keep); color: #fff; }
.badge.s-質問 { background: var(--st-ask); color: #fff; } .badge.s-自分で修正, .badge.s-修正を依頼 { background: var(--st-work); color: #fff; }
.badge.s-未確認 { color: #222; }
.empty { padding: 16px; color: var(--muted); }
#detail .t { font-weight: 700; font-size: 14px; }
#detail .row { margin: 3px 0; }
#detail .row .k { display: inline-block; width: 4.5em; color: var(--muted); }
#detail .meaning { color: var(--muted); font-size: 12px; margin-left: 4px; }
#detail h4 { margin: 8px 0 3px; font-size: 12px; color: var(--muted); }
#detail .text { white-space: pre-wrap; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; }
#detail .action { white-space: pre-wrap; background: #eef4ff; border-radius: 4px; padding: 5px 8px; }
#detail .req { white-space: pre-wrap; background: #fff1d6; border-left: 4px solid var(--sev-推奨); border-radius: 4px; padding: 6px 9px;
  font-weight: 600; font-size: 14px; margin: 6px 0 4px; }
#detail .req::before { content: '依頼'; display: block; font-size: 11px; color: var(--sev-推奨); margin-bottom: 1px; }
#detail .bg { color: #555; }
#detail .figs img { display: block; max-width: 100%; margin: 4px 0; border-radius: 4px; cursor: zoom-in; background: #111; }
#lb { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.88); display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
#lb[hidden] { display: none; }
#lb img { max-width: 96vw; max-height: 94vh; }
#detail .none { color: var(--muted); }
.review-btns { display: flex; gap: 4px; margin: 0 0 4px; flex-wrap: nowrap; }
.review-btns button { flex: 1 1 0; min-width: 0; padding: 1px 0; font-size: 12px; }
.review-btns button[data-st="修正済み"] { flex-grow: 1.4; color: var(--st-done); border-color: var(--st-done); font-weight: 700; }
.review-btns button.on[data-st="修正済み"] { background: var(--st-done); border-color: var(--st-done); color: #fff; }
.review-btns button.on[data-st="このまま"] { background: var(--st-keep); border-color: var(--st-keep); }
.review-btns button.on[data-st="修正を依頼"] { background: var(--st-work); border-color: var(--st-work); color: #fff; }
.msg { margin: 4px 0; padding: 5px 8px; border-radius: 6px; white-space: pre-wrap; max-width: 92%; }
.msg.user { background: #f0efe9; margin-left: auto; }
.msg.agent { background: #e6f0ff; }
.msg small { display: block; color: var(--muted); font-size: 11px; }
/* the status buttons and the comment box stay at the foot of the detail, whatever its length */
#post { flex: 0 0 auto; border-top: 1px solid var(--line); background: var(--panel); padding: 5px 8px 6px; }
#post[hidden] { display: none; }
#comment { flex: 1; min-width: 0; font: inherit; height: 28px; max-height: 120px; resize: none; padding: 3px 6px; line-height: 1.45;
  border: 1px solid var(--line); border-radius: 4px; }
.post-row { display: flex; align-items: flex-end; gap: 6px; }
.post-row button { height: 28px; }

/* board */
main { grid-column: 3; display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
#tools { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 5px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
#presets { display: flex; gap: 4px; }
#presets button { width: 4em; padding: 3px 0; }
#layerBoxes { display: flex; flex-wrap: wrap; gap: 2px 10px; }
#layerBoxes label { display: inline-flex; align-items: center; gap: 3px; cursor: pointer; font-size: 12px; }
#layerBoxes i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
#coord { color: var(--muted); font-size: 12px; width: 11em; font-variant-numeric: tabular-nums; }
#padTextBox { display: inline-flex; align-items: center; gap: 3px; cursor: pointer; font-size: 12px; }
#view { position: relative; overflow: hidden; background: #000; cursor: grab; touch-action: none; }
#view.drag { cursor: grabbing; }
#layers { position: absolute; inset: 0; z-index: 0; }
#layers img { position: absolute; left: 0; top: 0; max-width: none; pointer-events: none; user-select: none; }
#ov { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; }
#ov text { font: 700 13px system-ui, sans-serif; paint-order: stroke; stroke: #000; stroke-width: 3px; stroke-linejoin: round; }
#ov .pl text { font-family: system-ui, sans-serif; font-weight: 600; fill: #fff; stroke: rgba(0,0,0,.55); stroke-width: 1.5px;
  text-anchor: middle; dominant-baseline: central; }
#pop { position: absolute; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,.35); min-width: 220px; cursor: default; }
#pop[hidden] { display: none; }
#pop .what { font-weight: 600; }
#pop .xy { color: var(--muted); font-size: 11px; }
#pop .ask { display: flex; gap: 4px; margin-top: 5px; }
#pop input { font: inherit; flex: 1; min-width: 16em; padding: 2px 5px; border: 1px solid var(--line); border-radius: 4px; }
</style>
</head>
<body>
<header>
  <span class="name" id="bname">基板 レビュー</span>
  <span class="file" id="bfile"></span>
  <span id="bstat"></span>
  <button id="pageNew" class="off" title="このページの新しい版があります。押すと読み込み直す（入力中のコメントは消える）">画面を更新</button>
  <button id="reload" title="基板ファイルを読み直す（保存すると自動でも読み直す）">再読み込み</button>
</header>
<aside>
  <div class="list-h"><span id="progress"></span><span class="grow"></span><button id="showUnread">未読も表示</button><button id="showDone">完了も表示</button></div>
  <div id="list"></div>
  <div id="hsplit"></div>
  <div id="detail"><div id="detBody"><div class="empty">項目を選ぶと、ここに内容が出ます。基板の上を押すと、その場所について質問できます。</div></div>
    <div id="post" hidden>
      <div class="review-btns" id="stBtns"></div>
      <div class="post-row"><textarea id="comment" rows="1" placeholder="コメント（エージェントに届く。Ctrl+Enter で送信）"></textarea><button id="send">送信</button></div>
    </div>
  </div>
</aside>
<div id="split"></div>
<div id="lb" hidden></div>
<main>
  <div id="tools">
    <div id="presets"><button data-p="F">表</button><button data-p="B">裏</button><button data-p="In">内層</button><button data-p="all">全部</button></div>
    <div id="layerBoxes"></div>
    <label id="padTextBox" title="表示している面のパッドに、ピンの番号とネットの名前を出す（拡大すると出る）"><input type="checkbox" id="padText">ピン・ネット</label>
    <button id="fit" title="基板全体を表示。もう一度押すと元の拡大に戻る">全体</button>
    <span id="coord"></span>
  </div>
  <div id="view">
    <div id="layers"></div>
    <svg id="ov" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="pop" hidden></div>
  </div>
</main>
<script>
'use strict';
// ------------------------------------------------------------ constants and helpers
const POLL_MS = 3000;
const SEVERITIES = ['必須', '推奨', '任意', '情報'];
const SEV_MEANING = { '必須': '直さないと動かない・壊れる・製造で不良', '推奨': '直した方がよい（性能・信頼性）',
  '任意': 'できれば直す', '情報': 'そのままでよい・変更の報告' };
const OWNER_MEANING = { '人': 'KiCad で手で直す方が早い', 'エージェント': 'エージェントが直す', '未定': '担当はまだ決めていない' };
// buttons the page offers; 修正を依頼 is shown as 直して (the agent fixes it; a comment is optional). 自分で修正 is an older status
// that still displays
// 質問 has no button: a sent comment already hands the item to the agent. このまま is shown as OK (seen, nothing to change).
const STATUS_BTNS = ['修正済み', '直して', 'このまま'];
const BTN_LABEL = { '修正済み': '✔ 修正済み', '修正を依頼': '⚑ 直して', 'このまま': '✓ OK' };
const BTN_TITLE = { '修正を依頼': 'エージェントに直してもらう（コメントは任意）。', 'このまま': '確認した・このままでよい（直さない）。' };
const ST_NAME = { 'このまま': 'OK（このまま）' };
const BTN_STATUS = { '直して': '修正を依頼' };
const DONE = new Set(['このまま', '修正済み']);
const ST_MARK = { '未確認': '○', 'このまま': '－', '自分で修正': '✎', '修正を依頼': '⚑', '質問': '？', '修正済み': '✔' };
const ST_COLOR = { '未確認': '#ffd400', '自分で修正': '#ff8c00', '修正を依頼': '#ff8c00', '質問': '#ff3cff', 'このまま': '#9aa0a6', '修正済み': '#2ecc40' };
const FOCUS_MM = 20;          // selecting an item shows about this much board around it
const PIN_FOCUS_MM = 9;       // ... or around its pins, when it names them
const MAX_SCALE = 150;        // px per mm
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
};
async function api(path, body, method) {
  const opt = body === undefined ? { method: method || 'GET' } :
    { method: method || 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}
function notice(el, text) {            // a short confirmation right next to the control that was used
  const r = el.getBoundingClientRect();
  const n = document.createElement('div');
  n.className = 'notice';
  n.textContent = text;
  n.style.left = (r.right + 6) + 'px';
  n.style.top = (r.top + r.height / 2 - 10) + 'px';
  document.body.appendChild(n);
  if (r.right + 6 + n.offsetWidth > innerWidth) n.style.left = (r.left - n.offsetWidth - 6) + 'px';
  setTimeout(() => { n.style.opacity = 0; }, 1300);
  setTimeout(() => n.remove(), 1700);
}
const sideName = s => s === 'F' ? '表' : s === 'B' ? '裏' : s;
const cuLayer = s => s === 'F' ? 'F.Cu' : s === 'B' ? 'B.Cu' : s + '.Cu';
const idKey = id => { const m = /^(.*?)(\d+)$/.exec(id); return m ? [m[1], +m[2]] : [id, 0]; };
const byId = (a, b) => { const x = idKey(a), y = idKey(b); return x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : x[1] - y[1]; };

// ------------------------------------------------------------ state
const S = {
  board: null,                 // GET /api/board
  items: {}, rev: -1, file: '',
  sel: null,
  showDone: store.get('kireview.showDone') === '1',
  showUnread: store.get('kireview.showUnread') !== '0',
  stick: new Set(),            // finished items listed for an unread reply stay until a filter button is pressed
  padText: store.get('kireview.padText') !== '0',
  view: { s: 0, tx: 0, ty: 0 },   // screen px = board mm * s + t
  layers: null,                // {preset, active: 'F' | 'B' | 'In1' ..., vis: [layer names]}
  seen: null,                  // {id: agent messages already seen}
};
const seenKey = () => 'kireview.seen.' + (S.board ? S.board.stem : '');

// ------------------------------------------------------------ board view: layers, transform, presets
const view = $('view');
const imgs = {};               // layer name -> <img>

function copperKeys() { return S.board.copper.map(n => n === 'F.Cu' ? 'F' : n === 'B.Cu' ? 'B' : n.replace('.Cu', '')); }
function innerKeys() { return copperKeys().filter(k => k !== 'F' && k !== 'B'); }

function presetLayers(p, active) {
  const inner = S.board.copper.filter(n => n !== 'F.Cu' && n !== 'B.Cu');
  if (p === 'F') return ['F.Cu', 'F.Silkscreen', 'Edge.Cuts'];
  if (p === 'B') return ['B.Cu', 'B.Silkscreen', 'Edge.Cuts'];
  if (p === 'In') return [...inner, 'F.Silkscreen', 'Edge.Cuts'];
  return S.board.layers.map(l => l.name);
}

function setPreset(p, active) {
  if (!active) active = p === 'F' || p === 'B' ? p : p === 'In' ? (innerKeys().includes(S.layers.active) ? S.layers.active : innerKeys()[0] || 'F') : S.layers.active;
  S.layers = { preset: p, active, vis: presetLayers(p, active) };
  saveLayers();
  applyLayers();
}

function saveLayers() { store.set('kireview.layers', JSON.stringify(S.layers)); }

// stacking, bottom first: the far side, then the near side's copper and silkscreen, the outline on top
function layerOrder() {
  const a = S.layers.active, cu = S.board.copper.slice();
  const act = cuLayer(a);
  let order;
  if (a === 'B') order = ['F.Silkscreen', ...cu.filter(n => n !== 'B.Cu'), 'B.Cu', 'B.Silkscreen'];
  else if (a === 'F') order = ['B.Silkscreen', ...cu.slice().reverse().filter(n => n !== 'F.Cu'), 'F.Cu', 'F.Silkscreen'];
  else order = ['B.Silkscreen', 'B.Cu', 'F.Cu', ...cu.filter(n => n !== act && n !== 'F.Cu' && n !== 'B.Cu'), act, 'F.Silkscreen'];
  return [...order, 'Edge.Cuts'];
}

function applyLayers() {
  const order = layerOrder(), vis = new Set(S.layers.vis), a = S.layers.active;
  const inner = !(a === 'F' || a === 'B');
  for (const [name, img] of Object.entries(imgs)) {
    img.style.zIndex = order.indexOf(name) + 1;
    img.style.display = vis.has(name) ? '' : 'none';
    let op = 1;
    if (inner && name === 'F.Silkscreen') op = 0.35;           // orientation only
    else if (name.endsWith('.Cu') && name !== cuLayer(a)) op = 0.6;  // copper of the other sides, under the active one
    img.style.opacity = op;
  }
  document.querySelectorAll('#presets button').forEach(b => b.classList.toggle('on', b.dataset.p === S.layers.preset));
  document.querySelectorAll('#layerBoxes input').forEach(c => { c.checked = vis.has(c.value); });
  drawOverlay();
}

function buildLayerBoxes() {
  const box = $('layerBoxes');
  box.innerHTML = S.board.layers.map(l => '<label><input type="checkbox" value="' + esc(l.name) + '">' + esc(l.name) + '</label>').join('');
  box.querySelectorAll('input').forEach(c => c.addEventListener('change', () => {
    const vis = new Set(S.layers.vis);
    c.checked ? vis.add(c.value) : vis.delete(c.value);
    S.layers.vis = [...vis];
    S.layers.preset = 'custom';
    const k = c.value.endsWith('.Cu') ? copperKeys()[S.board.copper.indexOf(c.value)] : null;
    if (c.checked && k) S.layers.active = k;        // a copper layer just turned on comes to the top
    saveLayers();
    applyLayers();
  }));
}

// swap the layer pictures only when every new one has loaded, so a reload does not flash
function loadLayerImages() {
  const holder = $('layers'), want = S.board.layers;
  const fresh = want.map(l => new Promise(res => { const im = new Image(); im.alt = l.name; im.onload = im.onerror = () => res([l.name, im]); im.src = l.url; }));
  return Promise.all(fresh).then(list => {
    holder.innerHTML = '';
    for (const k of Object.keys(imgs)) delete imgs[k];
    for (const [name, im] of list) { imgs[name] = im; holder.appendChild(im); }
    placeImages();
    applyLayers();
  });
}

function placeImages() {
  const c = S.board.crop, v = S.view;
  for (const im of Object.values(imgs)) {
    im.style.left = (c[0] * v.s + v.tx) + 'px';
    im.style.top = (c[1] * v.s + v.ty) + 'px';
    im.style.width = ((c[2] - c[0]) * v.s) + 'px';
    im.style.height = ((c[3] - c[1]) * v.s) + 'px';
  }
}

function redraw() { placeImages(); drawOverlay(); }

function fitBoard() {
  const b = S.board.bbox || S.board.crop, W = view.clientWidth, H = view.clientHeight;
  const s = Math.min(W / (b[2] - b[0]), H / (b[3] - b[1])) * 0.92;
  S.view = { s, tx: W / 2 - (b[0] + b[2]) / 2 * s, ty: H / 2 - (b[1] + b[3]) / 2 * s };
  redraw();
}

// 全体 toggles: the first press shows the whole board and keeps the view it left, the second press goes back to that view
let viewBeforeWhole = null;
function toggleWhole() {
  if (viewBeforeWhole) { S.view = viewBeforeWhole; viewBeforeWhole = null; redraw(); }
  else { viewBeforeWhole = Object.assign({}, S.view); fitBoard(); }
  $('fit').classList.toggle('on', !!viewBeforeWhole);
}
function clearWhole() { viewBeforeWhole = null; $('fit').classList.remove('on'); }

function focusOn(x, y, mm) {
  const W = view.clientWidth, H = view.clientHeight;
  const s = Math.min(MAX_SCALE, Math.min(W, H) / mm);
  S.view = { s, tx: W / 2 - x * s, ty: H / 2 - y * s };
  redraw();
}

const toMM = (px, py) => [(px - S.view.tx) / S.view.s, (py - S.view.ty) / S.view.s];

function initPanZoom() {
  let drag = null;
  view.addEventListener('wheel', e => {
    e.preventDefault();
    const r = view.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    const [x, y] = toMM(px, py);
    const b = S.board.crop, fit = Math.min(view.clientWidth / (b[2] - b[0]), view.clientHeight / (b[3] - b[1]));
    const s = Math.max(fit * 0.4, Math.min(MAX_SCALE, S.view.s * Math.pow(1.0015, -e.deltaY)));
    S.view = { s, tx: px - x * s, ty: py - y * s };
    redraw();
  }, { passive: false });
  view.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('#pop')) return;
    drag = { x: e.clientX, y: e.clientY, tx: S.view.tx, ty: S.view.ty, moved: false };
    view.setPointerCapture(e.pointerId);
  });
  view.addEventListener('pointermove', e => {
    const r = view.getBoundingClientRect(), [x, y] = toMM(e.clientX - r.left, e.clientY - r.top);
    $('coord').textContent = 'x ' + x.toFixed(2) + '  y ' + y.toFixed(2) + ' mm';
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    drag.moved = true;
    view.classList.add('drag');
    S.view.tx = drag.tx + dx;
    S.view.ty = drag.ty + dy;
    redraw();
  });
  view.addEventListener('pointerup', e => {
    if (!drag) return;
    const moved = drag.moved;
    drag = null;
    view.classList.remove('drag');
    if (!moved) boardClick(e);
  });
}

// ------------------------------------------------------------ overlay: item markers in screen px
function markerGeom(it) {
  const v = S.view, cx = it.x * v.s + v.tx, cy = it.y * v.s + v.ty;
  if (it.w != null && it.h != null) return { box: true, cx, cy, hw: Math.max(6, it.w * v.s / 2), hh: Math.max(6, it.h * v.s / 2) };
  return { box: false, cx, cy, r: Math.max(9, (it.r || 1) * v.s) };
}

// pad number and net name on the pads of the active copper layer, like the KiCad editor; only where a pad is big enough on screen
function shortNet(n) {
  if (!n || n.startsWith('unconnected-')) return '';
  if (n.startsWith('/')) n = n.slice(n.lastIndexOf('/') + 1);    // hierarchical path: the last name, as KiCad shows it
  return n.replace(/\{slash\}/g, '/');
}
function padLabels(vis) {
  const lay = cuLayer(S.layers.active), d = S.board.dump;
  if (!S.padText || !d || !vis.has(lay)) return '';
  const v = S.view, W = view.clientWidth, H = view.clientHeight, out = [];
  const fit = (t, L, maxH) => Math.min(maxH, L * 0.9 / Math.max(1, t.length * 0.62));
  for (const p of d.pads) {
    if (!p.layers.includes(lay)) continue;
    let x0 = p.x - p.size[0] / 2, x1 = p.x + p.size[0] / 2, y0 = p.y - p.size[1] / 2, y1 = p.y + p.size[1] / 2;
    if (p.poly && p.poly.length) {
      const xs = p.poly.map(q => q[0]), ys = p.poly.map(q => q[1]);
      x0 = Math.min(...xs); x1 = Math.max(...xs); y0 = Math.min(...ys); y1 = Math.max(...ys);
    }
    const pw = (x1 - x0) * v.s, ph = (y1 - y0) * v.s;
    const cx = (x0 + x1) / 2 * v.s + v.tx, cy = (y0 + y1) / 2 * v.s + v.ty;
    if (cx + pw < 0 || cx - pw > W || cy + ph < 0 || cy - ph > H) continue;
    const vert = ph > pw * 1.15, L = vert ? ph : pw, sh = vert ? pw : ph;
    const num = p.num || '', net = shortNet(p.net);
    if (sh < 8 || (!num && !net)) continue;
    const g = vert ? '<g class="pl" transform="rotate(-90 ' + cx + ' ' + cy + ')">' : '<g class="pl">';
    const txt = (t, y, f) => '<text x="' + cx + '" y="' + y + '" style="font-size:' + f.toFixed(1) + 'px">' + esc(t) + '</text>';
    const f2 = net ? fit(net, L, sh * 0.3) : 0;
    if (net && sh >= 16 && f2 >= 4.5) {
      const f1 = num ? fit(num, L, sh * 0.42) : 0;
      out.push(g + (num ? txt(num, cy - sh * 0.2, f1) : '') + txt(net, cy + (num ? sh * 0.2 : 0), f2) + '</g>');
    } else if (num) {
      const f1 = fit(num, L, sh * 0.6);
      if (f1 >= 5) out.push(g + txt(num, cy, f1) + '</g>');
    }
  }
  return out.join('');
}

function drawOverlay() {
  const ov = $('ov');
  if (!S.board) return;
  const vis = new Set(S.layers.vis);
  const parts = [padLabels(vis)];
  const ids = Object.keys(S.items).sort((a, b) => (a === S.sel) - (b === S.sel) || byId(a, b));
  for (const id of ids) {
    const it = S.items[id], g = markerGeom(it);
    const col = ST_COLOR[it.status] || ST_COLOR['未確認'];
    const sel = id === S.sel, fixed = it.status === '修正済み', done = DONE.has(it.status);
    const onShown = (it.sides || []).some(s => vis.has(cuLayer(s)));
    const w = sel ? 4 : done && !fixed ? 1.2 : 2.2;
    const op = S.sel && !sel ? 0.4 : 1;
    const dash = onShown ? '' : ' stroke-dasharray="5 4"';
    const fill = fixed ? ' fill="' + col + '" fill-opacity="0.22"' : ' fill="none"';
    let shape, lx, ly;
    if (g.box) {
      const r = 'x="' + (g.cx - g.hw) + '" y="' + (g.cy - g.hh) + '" width="' + 2 * g.hw + '" height="' + 2 * g.hh + '"';
      shape = '<rect ' + r + ' fill="none" stroke="#000" stroke-width="' + (w + 3) + '"/><rect ' + r + fill + ' stroke="' + col + '" stroke-width="' + w + '"' + dash + '/>';
      lx = g.cx + g.hw + 3; ly = g.cy - g.hh - 3;
    } else {
      const c = 'cx="' + g.cx + '" cy="' + g.cy + '" r="' + g.r + '"';
      shape = '<circle ' + c + ' fill="none" stroke="#000" stroke-width="' + (w + 3) + '"/><circle ' + c + fill + ' stroke="' + col + '" stroke-width="' + w + '"' + dash + '/>';
      lx = g.cx + g.r * 0.72 + 2; ly = g.cy - g.r * 0.72 - 2;
    }
    parts.push('<g opacity="' + op + '">' + shape + '<text x="' + lx + '" y="' + ly + '" fill="' + col + '"' +
      (sel ? ' style="font-size:15px"' : '') + '>' + esc(id) + (fixed ? ' ✔' : '') + '</text></g>');
  }
  if (S.sel && S.items[S.sel]) parts.push(pinArrows(S.items[S.sel], ST_COLOR[S.items[S.sel].status] || ST_COLOR['未確認']));
  ov.innerHTML = parts.join('');
}

// the pads an item points at: its pins (["U3.2", ...]), else the refs written as REF.NUM
function itemPads(it) {
  const d = S.board && S.board.dump;
  if (!d) return [];
  const specs = it.pins && it.pins.length ? it.pins : (it.refs || []).filter(r => /\.[^.]+$/.test(r));
  const out = [];
  for (const sp of specs) {
    const k = sp.lastIndexOf('.'), ref = sp.slice(0, k), num = sp.slice(k + 1);
    for (const p of d.pads) if (p.ref === ref && p.num === num) out.push([sp, p]);
  }
  return out;
}
function padPoly(p) {
  if (p.poly && p.poly.length) return p.poly;
  const w = p.size[0] / 2, h = p.size[1] / 2;
  return [[p.x - w, p.y - h], [p.x + w, p.y - h], [p.x + w, p.y + h], [p.x - w, p.y + h]];
}
// selected item: outline each pin and point an arrow at it, coming from outside the footprint (away from its centre)
function pinArrows(it, col) {
  const v = S.view, d = S.board.dump, out = [];
  const fpAt = {};
  for (const f of d.footprints) fpAt[f.ref] = f;
  for (const [sp, p] of itemPads(it)) {
    const poly = padPoly(p);
    const pts = poly.map(q => (q[0] * v.s + v.tx).toFixed(1) + ',' + (q[1] * v.s + v.ty).toFixed(1)).join(' ');
    out.push('<polygon points="' + pts + '" fill="none" stroke="#000" stroke-width="5"/>' +
      '<polygon points="' + pts + '" fill="none" stroke="' + col + '" stroke-width="2.5"/>');
    const f = fpAt[p.ref];
    let ux = f ? p.x - f.x : 0, uy = f ? p.y - f.y : 0;
    const n = Math.hypot(ux, uy);
    if (n < 1e-3) { ux = -Math.SQRT1_2; uy = -Math.SQRT1_2; } else { ux /= n; uy /= n; }
    const xs = poly.map(q => q[0]), ys = poly.map(q => q[1]);
    const rad = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) / 2 * v.s;
    const cx = p.x * v.s + v.tx, cy = p.y * v.s + v.ty;
    const tx = cx + ux * (rad + 3), ty = cy + uy * (rad + 3);            // tip just outside the pad
    const L = 38, ex = tx + ux * L, ey = ty + uy * L;                    // tail
    const bx = tx + ux * 11, by = ty + uy * 11, nx = -uy * 5.5, ny = ux * 5.5;
    const head = tx + ',' + ty + ' ' + (bx + nx) + ',' + (by + ny) + ' ' + (bx - nx) + ',' + (by - ny);
    out.push('<line x1="' + ex + '" y1="' + ey + '" x2="' + bx + '" y2="' + by + '" stroke="#000" stroke-width="6"/>' +
      '<polygon points="' + head + '" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round"/>' +
      '<line x1="' + ex + '" y1="' + ey + '" x2="' + bx + '" y2="' + by + '" stroke="' + col + '" stroke-width="3"/>' +
      '<polygon points="' + head + '" fill="' + col + '"/>' +
      '<text x="' + (ex + ux * 4) + '" y="' + (ey + uy * 4 + 4) + '" fill="' + col + '" text-anchor="' + (ux >= 0 ? 'start' : 'end') + '">' + esc(sp) + '</text>');
  }
  return out.join('');
}

function hitItem(px, py) {
  let best = null;
  for (const [id, it] of Object.entries(S.items)) {
    const g = markerGeom(it);
    let d;
    if (g.box) d = Math.max(Math.abs(px - g.cx) - g.hw, Math.abs(py - g.cy) - g.hh, 0);
    else d = Math.max(0, Math.hypot(px - g.cx, py - g.cy) - g.r);
    const lab = g.box ? [g.cx + g.hw + 3, g.cy - g.hh - 3] : [g.cx + g.r * 0.72 + 2, g.cy - g.r * 0.72 - 2];
    if (px >= lab[0] - 2 && px <= lab[0] + 8 * id.length + 4 && py >= lab[1] - 14 && py <= lab[1] + 3) d = 0;
    if (d <= 6 && (!best || d < best[0])) best = [d, id];
  }
  return best && best[1];
}

// what is under a board point: the nearest pad of the shown side within 1.5 mm, else a footprint (same rule as the server)
function inside(poly, x, y) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [x0, y0] = poly[j], [x1, y1] = poly[i];
    if ((y0 > y) !== (y1 > y) && x < x0 + (y - y0) * (x1 - x0) / (y1 - y0)) c = !c;
  }
  return c;
}
function whatIsAt(x, y, side) {
  const d = S.board.dump, layer = cuLayer(side);
  let best = null;
  for (const p of d.pads) {
    if (!p.layers.includes(layer)) continue;
    const dist = p.poly && inside(p.poly, x, y) ? 0 : Math.hypot(p.x - x, p.y - y);
    if (dist <= 1.5 && (!best || dist < best[0])) best = [dist, p];
  }
  if (best) { const p = best[1]; return p.ref + ' ' + p.num + ' ' + (p.net || '(ネットなし)'); }
  const hits = d.footprints.filter(f => f.bbox[0] <= x && x <= f.bbox[2] && f.bbox[1] <= y && y <= f.bbox[3]);
  if (!hits.length) return '';
  const area = f => (f.bbox[2] - f.bbox[0]) * (f.bbox[3] - f.bbox[1]);
  hits.sort((a, b) => (a.side !== side) - (b.side !== side) || area(a) - area(b));
  const f = hits[0];
  return f.ref + ' (' + f.value + ') ' + sideName(f.side);
}

// ------------------------------------------------------------ board click: select a marker, or ask about the spot
function boardClick(e) {
  const r = view.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const id = hitItem(px, py);
  if (id) { hidePop(); select(id, true); return; }
  const [x, y] = toMM(px, py);
  showPop(px, py, x, y);
}

function showPop(px, py, x, y) {
  const pop = $('pop'), side = S.layers.active;
  const what = whatIsAt(x, y, side);
  pop.innerHTML = '<div class="what">' + esc(what || '（部品なし）') + '</div>' +
    '<div class="xy">x ' + x.toFixed(2) + '  y ' + y.toFixed(2) + ' mm（' + esc(sideName(side)) + '）</div>' +
    '<div class="ask"><button id="askBtn">ここに質問</button></div>';
  pop.hidden = false;
  pop.style.left = Math.min(px + 12, view.clientWidth - pop.offsetWidth - 6) + 'px';
  pop.style.top = Math.min(py + 12, view.clientHeight - pop.offsetHeight - 6) + 'px';
  $('askBtn').onclick = () => {
    pop.querySelector('.ask').innerHTML = '<input id="askText" placeholder="質問（Enter で送信）"><button id="askSend">送信</button>';
    pop.style.left = Math.max(6, Math.min(px + 12, view.clientWidth - pop.offsetWidth - 6)) + 'px';
    const inp = $('askText');
    inp.focus();
    const send = async () => {
      const comment = inp.value.trim();
      if (!comment) return;
      try {
        const it = await api('/api/review/new', { x, y, side, comment });
        hidePop();
        await pollReview(true);
        select(it.id, false);
        notice($('send'), '送信しました');
      } catch (err) { notice($('askSend'), 'エラー: ' + err.message); }
    };
    $('askSend').onclick = send;
    inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); send(); } else if (ev.key === 'Escape') hidePop(); });
  };
}
function hidePop() { $('pop').hidden = true; $('pop').innerHTML = ''; }

// ------------------------------------------------------------ item list
function agentCount(it) { return (it.thread || []).filter(m => m.who === 'agent').length; }
// a comment of the user that the agent has not answered yet
function waitingReply(it) { const th = it.thread || []; return th.length > 0 && th[th.length - 1].who === 'user'; }

function renderList() {
  const list = $('list'), top = list.scrollTop;
  const ids = Object.keys(S.items).sort(byId);
  const all = ids.length, left = ids.filter(id => !DONE.has(S.items[id].status)).length;
  const fixedN = ids.filter(id => S.items[id].status === '修正済み').length;
  $('progress').innerHTML = '残り ' + left + ' / 全 ' + all + '<span class="fixed">　✔ 修正済み ' + fixedN + '</span>';
  $('showDone').classList.toggle('on', S.showDone);
  $('showUnread').classList.toggle('on', S.showUnread);
  let html = '';
  for (const sev of [...SEVERITIES, '']) {
    const grp = ids.filter(id => sev ? S.items[id].severity === sev : !SEVERITIES.includes(S.items[id].severity));
    // 未読も表示: a finished item is listed while a reply is on its way or unread (mark it done and still see the
    // answer); once listed it stays, read or not, until a filter button is pressed, so rows do not vanish on a click
    const shown = grp.filter(id => {
      const it = S.items[id];
      if (S.showDone || !DONE.has(it.status) || id === S.sel) return true;
      if (S.showUnread && (S.stick.has(id) || waitingReply(it) || agentCount(it) > (S.seen[id] || 0))) { S.stick.add(id); return true; }
      return false;
    });
    if (!shown.length) continue;
    html += '<div class="sev-h"><span>' + esc(sev || 'その他') + '</span><small>' + shown.length + ' 件</small></div>';
    for (const id of shown) {
      const it = S.items[id], st = it.status || '未確認';
      const isNew = agentCount(it) > (S.seen[id] || 0);
      html += '<div class="item' + (id === S.sel ? ' sel' : '') + (DONE.has(st) ? ' done' : '') + (st === '修正済み' ? ' fixed' : '') + '" data-id="' + esc(id) + '">' +
        '<span class="st s-' + esc(st) + '" title="' + esc(ST_NAME[st] || st) + '">' + (ST_MARK[st] || '○') + '</span>' +
        '<span class="id">' + esc(id) + '</span>' +
        '<span class="t"><span class="chips">' + sevChip(it.severity) + '<span class="chip owner">' + esc(it.owner || '未定') + '</span></span>' + esc(it.title) + '</span>' +
        (isNew ? '<span class="new">未読</span>' : waitingReply(it) ? '<span class="new wait">返信待ち</span>' : '') + '</div>';
    }
  }
  list.innerHTML = html || '<div class="empty">' + (all ? '残りの項目はありません（「完了も表示」で全部）' : '項目はまだありません') + '</div>';
  list.scrollTop = top;
  list.querySelectorAll('.item').forEach(el => el.addEventListener('click', () => select(el.dataset.id, true)));
}

function sevChip(sev) {
  const c = getComputedStyle(document.documentElement).getPropertyValue('--sev-' + sev) || '#8a8a85';
  return '<span class="chip" style="background:' + c.trim() + '">' + esc(sev || '-') + '</span>';
}

// ------------------------------------------------------------ detail
let detailSig = '';
function renderDetail() {
  const it = S.sel && S.items[S.sel];
  $('post').hidden = !it;
  if (!it) {
    detailSig = '';
    $('detBody').innerHTML = '<div class="empty">項目を選ぶと、ここに内容が出ます。基板の上を押すと、その場所について質問できます。</div>';
    return;
  }
  const sig = S.sel + JSON.stringify(it);
  if (sig === detailSig) return;
  detailSig = sig;
  const st = it.status || '未確認';
  const where = (it.sides || []).map(sideName).join('・') + '　x ' + Number(it.x).toFixed(2) + '  y ' + Number(it.y).toFixed(2) + ' mm';
  let h = '<div class="t">' + esc(S.sel) + '　' + esc(it.title) + '</div>' +
    (it.ask ? '<div class="req">' + esc(it.ask) + '</div>' : '') +
    (it.figures && it.figures.length ? '<div class="figs">' + it.figures.map(n => '<img src="/figures/' + encodeURIComponent(n) + '" alt="' + esc(n) + '" title="押すと全画面">').join('') + '</div>' : '') +
    '<div class="row"><span class="k">重要度</span>' + sevChip(it.severity) + '<span class="meaning">' + esc(SEV_MEANING[it.severity] || '') + '</span></div>' +
    '<div class="row"><span class="k">担当</span><span class="chip owner">' + esc(it.owner || '未定') + '</span><span class="meaning">' + esc(OWNER_MEANING[it.owner] || '') + '</span></div>' +
    '<div class="row"><span class="k">場所</span>' + esc(where) + '</div>' +
    '<div class="row"><span class="k">部品</span>' + (it.refs && it.refs.length ? esc(it.refs.join(', ')) : '<span class="none">-</span>') +
    (it.near ? '<span class="meaning">' + esc(it.near) + '</span>' : '') + '</div>' +
    (it.pins && it.pins.length ? '<div class="row"><span class="k">ピン</span>' + esc(it.pins.join(', ')) + '<span class="meaning">（基板の図で矢印）</span></div>' : '') +
    '<div class="row"><span class="k">状態</span><span class="badge s-' + esc(st) + '">' + (ST_MARK[st] || '') + ' ' + esc(ST_NAME[st] || st) + '</span></div>';
  if (it.signal) h += '<h4>信号・電流・注意</h4><div class="text">' + esc(it.signal) + '</div>';
  if (it.ideal) h += '<h4>理想</h4><div class="text">' + esc(it.ideal) + '</div>';
  if (it.background) h += '<h4>経緯</h4><div class="text bg">' + esc(it.background) + '</div>';
  if (it.text) h += '<h4>内容</h4><div class="text">' + esc(it.text) + '</div>';
  if (it.action) h += '<h4>直し方</h4><div class="action">' + esc(it.action) + '</div>';
  const th = it.thread || [];
  h += '<h4>やりとり</h4>' + (th.length ? th.map(m => '<div class="msg ' + (m.who === 'agent' ? 'agent' : 'user') + '"><small>' +
    (m.who === 'agent' ? 'エージェント' : 'あなた') + '　' + esc(m.time || '') + '</small>' + esc(m.text) + '</div>').join('') : '<div class="none">まだありません</div>');
  $('detBody').innerHTML = h;
  $('stBtns').innerHTML = STATUS_BTNS.map(b => BTN_STATUS[b] || b).map(b => '<button data-st="' + b + '" class="' + (st === b ? 'on' : '') +
    '" title="' + (BTN_TITLE[b] || '') + 'もう一度押すと未確認に戻る">' + (BTN_LABEL[b] || b) + '</button>').join('');
  $('stBtns').querySelectorAll('button').forEach(b => b.addEventListener('click', () => setStatus(b)));
  $('detBody').querySelectorAll('.figs img').forEach(im => im.addEventListener('click', () => openFigure(im.src)));
}

// the item d rows away from id in the list as shown (id null: the first row, or the last when going up)
function neighbor(id, d) {
  const ids = [...document.querySelectorAll('#list .item')].map(el => el.dataset.id);
  const i = id ? ids.indexOf(id) : -1;
  if (i < 0) return d < 0 ? ids[ids.length - 1] : ids[0];
  return ids[i + d];
}

// A status press moves on to the next row; text in the comment box goes with the status (a note on OK, the request for 直して).
async function setStatus(btn) {
  const id = S.sel, it = S.items[id], ta = $('comment'), text = ta.value.trim();
  const status = it.status === btn.dataset.st ? '未確認' : btn.dataset.st;
  const withText = status !== '未確認' && !!text;
  const next = neighbor(id, 1);
  try {
    const r = await api('/api/review/user', withText ? { id, status, comment: text } : { id, status });
    S.items[id] = stripId(r);
    if (withText) { ta.value = ''; fitComment(); }
    if (status !== '未確認' && next) select(next, true);
    else renderAll();
    const b = document.querySelector('.review-btns button[data-st="' + btn.dataset.st + '"]');
    notice(b || btn, '送信しました');
  } catch (e) { notice(btn, 'エラー: ' + e.message); }
}

// a figure full screen; a click anywhere or Esc closes it
function openFigure(src) { const lb = $('lb'); lb.innerHTML = '<img src="' + esc(src) + '">'; lb.hidden = false; }
function closeFigure() { const lb = $('lb'); lb.hidden = true; lb.innerHTML = ''; }

function fitComment() {               // the comment box grows with its text, up to its max-height
  const ta = $('comment');
  ta.style.height = '';
  if (ta.value) ta.style.height = Math.min(ta.scrollHeight + 2, 120) + 'px';
}

async function sendComment() {
  const id = S.sel, ta = $('comment'), text = ta.value.trim();
  if (!id || !text) return;
  try {
    const r = await api('/api/review/user', { id, comment: text });
    ta.value = '';
    fitComment();
    S.items[id] = stripId(r);
    renderAll();                      // sent: stay on this row (only a status press moves on)
    notice($('send'), '送信しました');
  } catch (e) { notice($('send'), 'エラー: ' + e.message); }
}

function stripId(r) { const o = Object.assign({}, r); delete o.id; delete o.rev; return o; }

// ------------------------------------------------------------ selection
function select(id, move) {
  if (!S.items[id]) return;
  if (S.sel !== id) { $('comment').value = ''; fitComment(); }
  S.sel = id;
  const it = S.items[id];
  markSeen(id);
  if (move) {
    clearWhole();
    const pads = itemPads(it);
    let side = (it.sides || ['F'])[0];
    if (pads.length) {                 // pins given: show the side the first pin is on (an SMD pad is on one side only)
      const L = pads[0][1].layers, f = L.includes('F.Cu'), bk = L.includes('B.Cu');
      if (f && !bk) side = 'F';
      else if (bk && !f) side = 'B';
    }
    if (side === 'F' || side === 'B') setPreset(side);
    else setPreset('In', side);
    if (pads.length) {                 // pins given: frame the pins, closer than an area
      const xs = pads.flatMap(([, p]) => padPoly(p).map(q => q[0])), ys = pads.flatMap(([, p]) => padPoly(p).map(q => q[1]));
      const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
      focusOn((x0 + x1) / 2, (y0 + y1) / 2, Math.max(PIN_FOCUS_MM, (x1 - x0) * 1.6, (y1 - y0) * 1.6));
    } else {
      const span = Math.max(FOCUS_MM, (it.w || 0) * 1.5, (it.h || 0) * 1.5, (it.r || 0) * 4);
      focusOn(it.x, it.y, span);
    }
  }
  renderAll();
  const row = document.querySelector('#list .item.sel');
  if (row) row.scrollIntoView({ block: 'nearest' });
}

function deselect() { S.sel = null; renderAll(); }

function markSeen(id) {
  const it = S.items[id];
  if (!it) return;
  S.seen[id] = agentCount(it);
  store.set(seenKey(), JSON.stringify(S.seen));
}

function renderAll() { renderList(); renderDetail(); drawOverlay(); }

// ------------------------------------------------------------ polling
async function pollReview(force) {
  let d;
  try { d = await api('/api/review'); } catch (_) { return; }
  if (!force && d.rev === S.rev) return;
  S.rev = d.rev;
  S.items = d.items || {};
  if (S.seen === null) {           // first visit: what is there now counts as seen
    const saved = store.get(seenKey());
    S.seen = saved ? JSON.parse(saved) : Object.fromEntries(Object.entries(S.items).map(([k, v]) => [k, agentCount(v)]));
    store.set(seenKey(), JSON.stringify(S.seen));
  }
  if (S.sel && !S.items[S.sel]) S.sel = null;
  if (S.sel) markSeen(S.sel);
  renderAll();
}

function showBoardStatus(st, err) {
  const el = $('bstat');
  el.textContent = st === 'reloading' ? '再読み込み中' : st === 'error' ? '書き出し失敗' : '';
  el.classList.toggle('err', st === 'error');
  el.title = err || '';
}

async function pollBoard() {
  let v;
  try { v = await api('/api/board/version'); } catch (_) { return; }
  if (S.pageStamp === undefined) S.pageStamp = v.page;
  $('pageNew').classList.toggle('off', !(v.page && v.page !== S.pageStamp));   // the page itself was updated: offer a reload
  if (v.version !== S.board.version) {
    showBoardStatus('reloading');
    S.board = await api('/api/board');
    await loadLayerImages();
  }
  showBoardStatus(v.status, v.error);
}

// ------------------------------------------------------------ layout: splitters, keys, buttons
function initLayout() {
  const w = store.get('kireview.listw'), h = store.get('kireview.deth');
  if (w) document.body.style.setProperty('--listw', w);
  if (h) document.body.style.setProperty('--deth', h);
  const drag = (el, move, done) => el.addEventListener('pointerdown', e => {
    e.preventDefault();
    el.classList.add('drag');
    el.setPointerCapture(e.pointerId);
    const mv = ev => move(ev);
    const up = () => { el.classList.remove('drag'); el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); done(); };
    el.addEventListener('pointermove', mv);
    el.addEventListener('pointerup', up);
  });
  drag($('split'), e => document.body.style.setProperty('--listw', Math.max(260, Math.min(innerWidth - 300, e.clientX)) + 'px'),
    () => { store.set('kireview.listw', document.body.style.getPropertyValue('--listw')); redraw(); });
  drag($('hsplit'), e => {
    const a = document.querySelector('aside').getBoundingClientRect();
    document.body.style.setProperty('--deth', Math.max(80, Math.min(a.height - 120, a.bottom - e.clientY)) + 'px');
  }, () => store.set('kireview.deth', document.body.style.getPropertyValue('--deth')));
  $('showDone').addEventListener('click', () => { S.showDone = !S.showDone; store.set('kireview.showDone', S.showDone ? '1' : '0'); S.stick.clear(); renderList(); });
  $('showUnread').addEventListener('click', () => { S.showUnread = !S.showUnread; store.set('kireview.showUnread', S.showUnread ? '1' : '0'); S.stick.clear(); renderList(); });
  $('lb').addEventListener('click', closeFigure);
  $('pageNew').addEventListener('click', () => location.reload());
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('lb').hidden) { e.stopImmediatePropagation(); closeFigure(); } }, true);
  $('padText').checked = S.padText;
  $('padText').addEventListener('change', e => { S.padText = e.target.checked; store.set('kireview.padText', S.padText ? '1' : '0'); drawOverlay(); });
  $('send').addEventListener('click', sendComment);
  $('comment').addEventListener('input', fitComment);
  $('comment').addEventListener('keydown', e => { if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); sendComment(); } });
  $('fit').addEventListener('click', toggleWhole);
  $('reload').addEventListener('click', async e => {
    try { await api('/api/reload', {}); showBoardStatus('reloading'); notice(e.currentTarget, '読み直します'); } catch (err) { notice($('reload'), 'エラー: ' + err.message); }
  });
  document.querySelectorAll('#presets button').forEach(b => b.addEventListener('click', () => setPreset(b.dataset.p)));
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('pop').hidden) { hidePop(); return; }
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { document.activeElement.blur(); return; }
    deselect();
  });
  document.addEventListener('keydown', e => {   // ↑ / ↓: the previous / next row of the list (not while typing)
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || !$('lb').hidden || !$('pop').hidden) return;
    const id = neighbor(S.sel, e.key === 'ArrowDown' ? 1 : -1);
    e.preventDefault();
    if (id) select(id, true);
  });
  document.addEventListener('pointerdown', e => { if (!$('pop').hidden && !e.target.closest('#pop') && !e.target.closest('#view')) hidePop(); });
  addEventListener('resize', redraw);
}

async function main() {
  initLayout();
  initPanZoom();
  S.board = await api('/api/board');
  $('bname').textContent = S.board.stem;
  $('bfile').textContent = S.board.board;
  $('bfile').title = S.board.board;
  document.title = S.board.stem + ' 基板レビュー';
  buildLayerBoxes();
  let saved = null;
  try { saved = JSON.parse(store.get('kireview.layers') || 'null'); } catch (_) {}
  const names = S.board.layers.map(l => l.name);
  if (saved && saved.vis && copperKeys().includes(saved.active)) S.layers = { preset: saved.preset, active: saved.active, vis: saved.vis.filter(n => names.includes(n)) };
  else S.layers = { preset: 'F', active: 'F', vis: presetLayers('F', 'F') };
  fitBoard();
  await loadLayerImages();
  showBoardStatus(S.board.status, S.board.error);
  await pollReview(true);
  setInterval(pollReview, POLL_MS);
  setInterval(pollBoard, POLL_MS);
}
main();
</script>
